# Self-host profile (specification section 13, "Compose"). One server container
# with KB_ROLE=all, Postgres, NATS, SeaweedFS as the S3 endpoint and a pgBackRest
# sidecar for encrypted backups. Copy .env.example to .env and set the three
# required values, then `docker compose up -d`.
name: kb

services:
  kb:
    image: ${KB_IMAGE:-ghcr.io/acx1729/ocean:latest}
    build:
      context: ../..
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      seaweedfs:
        condition: service_started
    environment:
      KB_ROLE: all
      KB_PUBLIC_URL: ${KB_PUBLIC_URL:?set KB_PUBLIC_URL in .env}
      KB_LISTEN: ":8080"
      KB_BOOTSTRAP_ADMIN_DID: ${KB_BOOTSTRAP_ADMIN_DID:?set KB_BOOTSTRAP_ADMIN_DID in .env}
      KB_DATABASE_URL: postgres://kb:${POSTGRES_PASSWORD:-kb}@postgres:5432/kb?sslmode=disable
      KB_FGA_DATABASE_URL: postgres://kb:${POSTGRES_PASSWORD:-kb}@postgres:5432/fga?sslmode=disable
      KB_RIVER_DATABASE_URL: postgres://kb:${POSTGRES_PASSWORD:-kb}@postgres:5432/river?sslmode=disable
      KB_NATS_URL: nats://nats:4222
      KB_S3_ENDPOINT: http://seaweedfs:8333
      KB_S3_BUCKET: kb
      KB_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kb}
      KB_S3_SECRET_KEY: ${S3_SECRET_KEY:-kb-secret-change-me}
      KB_S3_REGION: us-east-1
      KB_NODE_KEY_FILE: /var/lib/kb/node.key
      KB_NODE_KEY_PASSPHRASE: ${KB_NODE_KEY_PASSPHRASE:?set KB_NODE_KEY_PASSPHRASE in .env}
      KB_EVM_RPC_URL: ${KB_EVM_RPC_URL:-}
      KB_LOG_LEVEL: ${KB_LOG_LEVEL:-info}
      KB_DEV: ${KB_DEV:-false}
    volumes:
      - kb-data:/var/lib/kb
    ports:
      - "${KB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/kb", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kb}
      POSTGRES_DB: kb
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - random_page_cost=1.1
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=2GB
      - -c
      - wal_compression=off
      - -c
      - synchronous_commit=on
      - -c
      - autovacuum_max_workers=6
      - -c
      - track_io_timing=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - archive_mode=on
      - -c
      - archive_command=/bin/true
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 5s
      timeout: 5s
      retries: 20

  nats:
    image: nats:2
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: ["server", "-s3", "-s3.port=8333", "-dir=/data", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=1024"]
    volumes:
      - seaweed-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # pgBackRest sidecar: nightly base backups plus continuous WAL archiving to the
  # same bucket, encrypted client-side (repo1-cipher-type=aes-256-cbc) with a
  # passphrase the operator derives from the node key (AdminService.ExportNodeKey).
  pgbackrest:
    image: pgbackrest/pgbackrest:2.55.1
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:?set PGBACKREST_CIPHER_PASS in .env}
      PGBACKREST_REPO1_S3_KEY: ${S3_ACCESS_KEY:-kb}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${S3_SECRET_KEY:-kb-secret-change-me}
    volumes:
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - pg-data:/var/lib/postgresql/data:ro

volumes:
  kb-data:
  pg-data:
  nats-data:
  seaweed-data:
