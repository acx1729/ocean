name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/loro-cabi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Create databases
        run: |
          psql -h 127.0.0.1 -p 55432 -U postgres -c "CREATE DATABASE kb;" -c "CREATE DATABASE fga;" -c "CREATE DATABASE river;" -c "CREATE DATABASE query_test;"
          psql -h 127.0.0.1 -p 55432 -U postgres -d kb -c "CREATE EXTENSION ltree; CREATE EXTENSION pg_trgm;"
          psql -h 127.0.0.1 -p 55432 -U postgres -d query_test -c "CREATE EXTENSION ltree; CREATE EXTENSION pg_trgm;"
      - name: Build Loro shim
        run: make loro
      - name: Lint
        run: make lint
      - name: Test
        env:
          KB_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:55432/kb_db_test?sslmode=disable
        run: go test -race -count=1 ./...
      - name: Build binary
        run: make build

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: false
          breaking: false
          push: false

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web app
        working-directory: web
        run: |
          if [ -f package.json ]; then npm ci && npm run build && npm test --if-present; else echo "web app not present yet"; fi

  docker:
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: kb:ci
